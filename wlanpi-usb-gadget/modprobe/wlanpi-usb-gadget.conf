# Prevent legacy composite gadget modules from auto-binding the UDC via
# usb_udc modalias uevents before wlanpi-usb-gadget configures configfs.
# Note: configfs serial console uses usb_f_acm (f_acm), which is unaffected.
blacklist g_ether
blacklist g_ncm
blacklist g_cdc
blacklist g_serial

install g_ether /bin/false
install g_ncm /bin/false
install g_cdc /bin/false
install g_serial /bin/false
